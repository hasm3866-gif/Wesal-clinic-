
name: Build Wasl Clinic APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o WaslClinic_Source.zip -d source

      - name: Generate Gradle Wrapper
        run: gradle -p source wrapper --gradle-version 8.9

      - name: Build APK
        run: cd source && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaslClinic-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
